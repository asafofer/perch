version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    groups:
      ui:
        patterns: ["*"]
  # Sparkle: an update here changes how installed copies update themselves, so read its release notes before merging
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
