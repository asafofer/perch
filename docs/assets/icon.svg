    </g>
    <ellipse cx="437.1" cy="636.1" rx="40.3" ry="69.1" fill="#2B1B0E"/>
    <ellipse cx="586.9" cy="636.1" rx="40.3" ry="69.1" fill="#2B1B0E"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
